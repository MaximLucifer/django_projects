{% extends "base.html" %}

{% block title %}Создать бронирование{% endblock %}

{% block content %}

<div class="container mt-5">
    <h1 class="text-center mb-4">Создание бронирования</h1>

    <form method="post" class="needs-validation" novalidate>
        {% csrf_token %}
        {{ form.as_p }}
        <div class="d-grid">
            <button type="submit" class="btn btn-success">Создать бронирование</button>
        </div>
    </form>
</div>

{% endblock %}
