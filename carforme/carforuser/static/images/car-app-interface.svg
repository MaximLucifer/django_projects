<svg viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Phone Frame -->
  <rect x="100" y="20" width="200" height="160" rx="20" fill="#34495e"/>
  <rect x="110" y="30" width="180" height="140" rx="15" fill="#fff"/>
  
  <!-- App Header -->
  <rect x="110" y="30" width="180" height="30" fill="#3498db"/>
  <text x="200" y="50" font-family="Arial" font-size="12" fill="white" text-anchor="middle">Эх, прокачу!</text>
  
  <!-- Car List -->
  <rect x="120" y="70" width="160" height="30" rx="5" fill="#f5f6fa"/>
  <rect x="120" y="110" width="160" height="30" rx="5" fill="#f5f6fa"/>
  
  <!-- Car Icons -->
  <rect x="130" y="75" width="20" height="20" rx="2" fill="#3498db"/>
  <rect x="130" y="115" width="20" height="20" rx="2" fill="#3498db"/>
  
  <!-- Text Lines -->
  <line x1="160" y1="85" x2="270" y2="85" stroke="#7f8c8d" stroke-width="2"/>
  <line x1="160" y1="125" x2="270" y2="125" stroke="#7f8c8d" stroke-width="2"/>
</svg>
