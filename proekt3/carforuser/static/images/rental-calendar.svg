<svg viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="200" fill="#f8f9fa"/>
  
  <!-- Calendar Base -->
  <rect x="100" y="40" width="200" height="140" fill="#fff" stroke="#2c3e50" stroke-width="2"/>
  
  <!-- Calendar Header -->
  <rect x="100" y="40" width="200" height="30" fill="#e74c3c"/>
  <text x="200" y="60" font-family="Arial" font-size="14" fill="white" text-anchor="middle">БРОНИРОВАНИЕ</text>
  
  <!-- Calendar Grid -->
  <path d="M100 90 L300 90 M100 120 L300 120 M100 150 L300 150" stroke="#bdc3c7" stroke-width="1"/>
  <path d="M140 70 L140 180 M180 70 L180 180 M220 70 L220 180 M260 70 L260 180" stroke="#bdc3c7" stroke-width="1"/>
  
  <!-- Selected Date -->
  <rect x="140" y="90" width="40" height="30" fill="#3498db" opacity="0.3"/>
  <circle cx="160" cy="105" r="12" fill="#3498db"/>
  <text x="160" y="110" font-family="Arial" font-size="12" fill="white" text-anchor="middle">15</text>
</svg>
