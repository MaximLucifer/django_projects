  <!-- Car Body -->
  <path d="M50 120 L100 120 L130 90 L270 90 L300 120 L350 120 C350 120 360 120 360 130 L360 150 C360 160 350 160 350 160 L320 160 C320 180 300 180 300 160 L100 160 C100 180 80 180 80 160 L50 160 C50 160 40 160 40 150 L40 130 C40 120 50 120 50 120 Z" fill="#2c3e50"/>
  
  <!-- Windows -->
