{% extends 'base.html' %}

{% block title %}История заявок{% endblock %}

{% block content %}

<div>
    <h1>Ваши заявки</h1>
    <ul>
        {% for req in requests %}
            <li>{{ req.category }} | {{ req.description }} | {{ req.status }}</li> 
        {% endfor %}
    </ul>
    <div>
        <a href="{% url 'create_request' %}">Создать заявку</a>
    </div>

{% endblock %}
