{% extends 'base.html' %}

{% block title %}Авторизация — Модуль 2{% endblock %}

{% block content %}
<div class="login-container">
    <h1>Авторизация</h1>
    <form method="post" class="login-form">
        {% csrf_token %}
        <div class="form-group">
            <label for="username">Логин</label>
            <input type="text" id="username" name="username" placeholder="Введите ваш логин" required>
        </div>
        <div class="form-group">
            <label for="password">Пароль</label>
            <input type="password" id="password" name="password" placeholder="Введите ваш пароль" required>
        </div>
        <button type="submit" class="btn">Войти</button>
        <p>Нет аккаунта? <a href="{% url 'module2:module2_register' %}">Зарегистрироваться</a></p>
        <p>Забыли пароль? <a href="#">Восстановить</a></p>
    </form>
</div>
{% endblock %}
