{% extends 'base.html' %}

{% block title %}Формирование заявки — Модуль 1{% endblock %}

{% block content %}
<h1>Ваши заявки</h1>
<ul>
    {% for req in requests %}
        <li>{{ req.address }} - {{ req.get_service_type_display }} ({{ req.get_status_display }})</li>
    {% endfor %}
</ul>
<a href="{% url 'module2_create_request' %}">Создать заявку</a>
{% endblock %}
